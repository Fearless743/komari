name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build assets for
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --locked

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: true
            extension: ""
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
            extension: ""
          - name: darwin-amd64
            os: macos-14
            target: x86_64-apple-darwin
            use_cross: false
            extension: ""
          - name: darwin-arm64
            os: macos-14
            target: aarch64-apple-darwin
            use_cross: false
            extension: ""
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            extension: ".exe"
    env:
      # Go release workflow: -X .../utils.CurrentVersion=<tag>
      #                    -X .../utils.VersionHash=<commit sha>
      KOMARI_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
      KOMARI_VERSION_HASH: ${{ github.sha }}
      TARGET: ${{ matrix.target }}
      NAME: ${{ matrix.name }}
      EXTENSION: ${{ matrix.extension }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Build frontend assets
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Build binary
        shell: bash
        run: |
          touch crates/komari-cli/src/version.rs
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --locked --release -p komari-cli --target "${TARGET}"
          else
            cargo build --locked --release -p komari-cli --target "${TARGET}"
          fi

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${TARGET}/release/komari${EXTENSION}" "dist/komari-${NAME}${EXTENSION}"
          # Portable checksum: coreutils/shasum availability differs on the
          # Windows and macOS runners, but Python is present on all of them.
          if command -v python3 >/dev/null 2>&1; then
            PYTHON=python3
          elif command -v python >/dev/null 2>&1; then
            PYTHON=python
          else
            PYTHON=""
          fi
          if [[ -n "${PYTHON}" ]]; then
            "${PYTHON}" - "dist/komari-${NAME}${EXTENSION}" "dist/komari-${NAME}.sha256" <<'PY'
          import hashlib
          import sys

          src, dst = sys.argv[1], sys.argv[2]
          with open(src, "rb") as handle:
              digest = hashlib.sha256(handle.read()).hexdigest()
          with open(dst, "w", encoding="utf-8") as handle:
              handle.write(f"{digest}  {src.rsplit('/', 1)[-1]}\n")
          PY
          else
            echo "::warning::python not found; skipping checksum for ${NAME}"
          fi

      - name: Upload artifact to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: komari-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Upload artifact to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${RELEASE_TAG}" dist/* \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"

  docker:
    name: Publish Docker image
    needs:
      - test
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KOMARI_VERSION=${{ github.event.release.tag_name || inputs.tag }}
            KOMARI_VERSION_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
